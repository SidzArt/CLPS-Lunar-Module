[project]
name = "clps-luna-backend"
version = "0.1.0"
description = "CLPS Luna Browser - Backend API and Scientific Simulation Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pillow>=11.0.0",
    "openpyxl>=3.1.5",
    "spiceypy>=8.3.0",
    "numpy>=2.5.4",
    "rasterio>=1.5.2",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
